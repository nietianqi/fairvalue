spring.application.name=fairvalue-engine
server.port=${SERVER_PORT:18080}
spring.jackson.property-naming-strategy=SNAKE_CASE
management.endpoints.web.exposure.include=health,info
server.error.include-message=always
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
app.postgres.embedded.enabled=true
app.postgres.embedded.port=5432
app.postgres.embedded.database=fairvalue
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=fairvalue
spring.flyway.default-schema=fairvalue
spring.flyway.create-schemas=true
market-data.cn.live.enabled=true
market-data.cn.live.base-url=https://push2.eastmoney.com
market-data.cn.live.quote-cache-ttl-seconds=20
market-data.cn.live.universe-cache-ttl-seconds=30
market-data.cn.live.default-page-size=30
market-data.cn.live.max-page-size=60
market-data.us.live.enabled=true
market-data.us.live.sec-base-url=https://data.sec.gov
market-data.us.live.sec-tickers-url=https://www.sec.gov/files/company_tickers.json
market-data.us.live.stooq-base-url=https://stooq.com
market-data.us.live.sec-user-agent=FairvalueEngine/0.1 fairvalue@example.com
market-data.us.live.ticker-universe-cache-ttl-seconds=21600
market-data.us.live.profile-cache-ttl-seconds=21600
market-data.us.live.quote-cache-ttl-seconds=900
market-data.us.live.universe-sync-on-startup=false
market-data.us.live.universe-sync-max-retries=3
market-data.us.live.universe-sync-retry-backoff-millis=1500
market-data.us.longbridge.enabled=${MARKET_DATA_US_LONGBRIDGE_ENABLED:false}
market-data.us.longbridge.app-key=${LONGBRIDGE_APP_KEY:}
market-data.us.longbridge.app-secret=${LONGBRIDGE_APP_SECRET:}
market-data.us.longbridge.access-token=${LONGBRIDGE_ACCESS_TOKEN:}
market-data.us.longbridge.history-bars=${MARKET_DATA_US_LONGBRIDGE_HISTORY_BARS:252}
market-data.us.longbridge.quote-cache-ttl-seconds=${MARKET_DATA_US_LONGBRIDGE_QUOTE_CACHE_TTL_SECONDS:30}
market-data.us.longbridge.request-timeout-seconds=${MARKET_DATA_US_LONGBRIDGE_REQUEST_TIMEOUT_SECONDS:20}
market-data.us.fred.enabled=${MARKET_DATA_US_FRED_ENABLED:false}
market-data.us.fred.base-url=https://api.stlouisfed.org
market-data.us.fred.graph-base-url=https://fred.stlouisfed.org
market-data.us.fred.api-key=${FRED_API_KEY:}
market-data.us.fred.risk-free-series-id=${MARKET_DATA_US_FRED_RISK_FREE_SERIES_ID:DGS10}
market-data.us.fred.policy-rate-series-id=${MARKET_DATA_US_FRED_POLICY_RATE_SERIES_ID:FEDFUNDS}
market-data.us.fred.cache-ttl-seconds=${MARKET_DATA_US_FRED_CACHE_TTL_SECONDS:21600}
market-data.us.fred.request-timeout-seconds=${MARKET_DATA_US_FRED_REQUEST_TIMEOUT_SECONDS:12}
market-data.us.damodaran.enabled=${MARKET_DATA_US_DAMODARAN_ENABLED:true}
market-data.us.damodaran.erp-url=https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/histimpl.html
market-data.us.damodaran.beta-url=https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/Betas.html
market-data.us.damodaran.pe-url=https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/pedata.html
market-data.us.damodaran.ev-ebitda-url=https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/vebitda.html
market-data.us.damodaran.cache-ttl-seconds=${MARKET_DATA_US_DAMODARAN_CACHE_TTL_SECONDS:43200}
market-data.us.damodaran.request-timeout-seconds=${MARKET_DATA_US_DAMODARAN_REQUEST_TIMEOUT_SECONDS:12}
